<!DOCTYPE html>
<!--
  EXPLORATION (not locked). Common header for the three homepage scroll options.
  Pick Option, Device and Theme at the top; the page below is a live homepage in your Bold look.
  Deep link: index.html#<a|b|c>-<desktop|phone>-<light|dark>
  Pages: a-snap.html, b-stack.html, c-flow.html. Opening one directly sends you here.
  Shared files: css/tokens.css (all variables), css/site.css, css/modes.css, js/site.js. Text is placeholder only.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll options</title>
<link rel="stylesheet" href="css/viewer.css">
</head>
<body>
<header class="viewer__bar">
  <div class="viewer__controls">
    <div class="viewer__group" role="group" aria-label="Scroll option">
      <span class="viewer__label">Option</span>
      <button class="viewer__button" data-key="option" data-value="a" aria-pressed="false">A Snap</button>
      <button class="viewer__button" data-key="option" data-value="b" aria-pressed="false">B Stack</button>
      <button class="viewer__button" data-key="option" data-value="c" aria-pressed="true">C Flow</button>
    </div>
    <div class="viewer__group" role="group" aria-label="Device">
      <span class="viewer__label">Device</span>
      <button class="viewer__button" data-key="device" data-value="desktop" aria-pressed="true">Desktop</button>
      <button class="viewer__button" data-key="device" data-value="phone" aria-pressed="false">Phone</button>
    </div>
    <div class="viewer__group" role="group" aria-label="Theme">
      <span class="viewer__label">Theme</span>
      <button class="viewer__button" data-key="theme" data-value="light" aria-pressed="true">Light</button>
      <button class="viewer__button" data-key="theme" data-value="dark" aria-pressed="false">Dark</button>
    </div>
  </div>
  <p class="viewer__note" id="note"></p>
</header>
<main class="viewer__stage" id="stage">
  <iframe class="viewer__frame" id="frame" title="Homepage preview"></iframe>
</main>
<script src="js/viewer.js"></script>
</body>
</html>
